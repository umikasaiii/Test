name: android-native

# DSLink Runtime + melonDS as a native Android app (arm64-v8a). Everything is built here because the NDK is not available in the authoring sandbox.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    # the platform-neutral half of the app (shared-memory front end) and the Runtime's shared-memory channel, on the desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Front end unit test (reader, audio ring policy, input, restart)
        run: cmake -S android-app/native -B build/fe -G Ninja -DDSLINK_HOST_TEST=ON && cmake --build build/fe && build/fe/fe_test
      - name: Stream encoder unit test (colour conversion into codec layouts, 48 kHz resampler, Annex-B, keyframes, SPS/PPS, drops, libopus from the pinned submodule)
        run: cmake -S runtime -B build/enc -G Ninja -DDSLINK_WITH_FFMPEG=OFF -DDSLINK_ENC_TEST=ON && cmake --build build/enc --target enc_test && build/enc/enc_test
      - name: Syntax check of the Android-only native sources against stub NDK headers
        run: |
          sudo apt-get install -y libegl-dev libgles-dev default-jdk-headless
          mkdir -p /tmp/stubs/android /tmp/stubs/aaudio
          cp tests/android/stubs/android/*.h /tmp/stubs/android/ && cp tests/android/stubs/aaudio/*.h /tmp/stubs/aaudio/
          JH=$(dirname $(dirname $(readlink -f $(which javac))))
          mkdir -p /tmp/stubs/media && cp tests/android/stubs/media/*.h /tmp/stubs/media/
          g++ -std=c++17 -fsyntax-only -Wall -Wextra -D__ANDROID__ -DDSLINK_WITH_MEDIACODEC=1 -I/tmp/stubs -Iruntime/src runtime/src/mediacodec_codec.cpp runtime/src/mediacodec_selftest.cpp
          for f in av_pipeline main; do g++ -std=c++17 -fsyntax-only -Wall -Wextra -DDSLINK_WITH_MEDIACODEC=1 -Iupstream/opus/include -Iruntime/src -Iupstream/retroarch/libretro-common/include runtime/src/$f.cpp; done
          for f in renderer audio_out jni_bridge; do g++ -std=c++17 -fsyntax-only -Wall -Wextra -I/tmp/stubs -I$JH/include -I$JH/include/linux -Iandroid-app/native -Iruntime/src -Idslink/include android-app/native/$f.cpp; done

  apk-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version-file: cloud/gateway/go.mod }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Pins
        run: scripts/check_pins.sh
      - name: Native build (melonDS core, Runtime, DSLink tools, JNI, gateway) for arm64-v8a
        env: { ANDROID_NDK: "${{ env.ANDROID_NDK_LATEST_HOME }}" }
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" scripts/build_android_native.sh arm64-v8a
      - name: JVM unit tests + debug APK
        working-directory: android-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: The APK carries the code and no private content
        run: |
          APK=$(ls android-app/app/build/outputs/apk/debug/*.apk | head -1)
          mkdir -p dist && cp "$APK" dist/DSLink-Hosted-iPhone-V0-arm64-debug.apk
          unzip -l "$APK" | tee /tmp/apk.txt
          for l in libdslink_runtime libdslink_jni libdslink_gateway libmelondsds_libretro libdslink_cfgtool libdslink_romcheck; do grep -q "lib/arm64-v8a/$l.so" /tmp/apk.txt || { echo "missing $l"; exit 1; }; done
          for a in assets/web/guest/manifest.webmanifest assets/web/mp/index.html assets/controls/controls.js; do grep -q "$a" /tmp/apk.txt || { echo "missing $a"; exit 1; }; done   # the guest page the iPhone is served
          if grep -Ei '\.(nds|srl)$|bios[79]?\.bin|firmware\.bin|\.sav$' /tmp/apk.txt; then echo "private/ROM-like file inside the APK"; exit 1; fi
          python3 scripts/check_no_private.py
          sha256sum dist/*.apk | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: DSLink-Hosted-iPhone-V0-arm64-debug, path: dist }

  emulator-x86_64:
    # The whole app on an Android EMULATOR (x86_64 build of the same code) with homebrew test content: Runtime + melonDS core from the APK, native GL surface, AAudio,
    # WebView with the frozen touch UI, JNI input, rotation, pause/resume, recreate, Back. This proves the Android pipeline; it does NOT prove arm64 speed (that needs a phone).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version-file: cloud/gateway/go.mod }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Homebrew test ROM (own code) for the instrumented test
        run: |
          mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
          mkdir -p android-app/app/src/androidTest/assets && cp build/rom/dslink_test_1.nds build/rom/dslink_test_2.nds android-app/app/src/androidTest/assets/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Native build for x86_64 (emulator ABI)
        env: { ANDROID_NDK: "${{ env.ANDROID_NDK_LATEST_HOME }}" }
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" scripts/build_android_native.sh x86_64
      - name: Instrumented tests on an API 30 x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: scripts/ci_emulator_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-emulator-reports, path: android-app/app/build/reports }
