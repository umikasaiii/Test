name: android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"   # RetroArch's Android project uses Gradle 6.7.1 / AGP 4.2.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Pure-Java unit tests (JVM)
        run: |
          set -e
          mkdir -p /tmp/jt && cd /tmp/jt
          curl -sSfLO https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfLO https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          mkdir out
          javac -d out -cp junit-4.13.2.jar $GITHUB_WORKSPACE/android/java/com/dslink/emulator/{Kv,Names}.java $GITHUB_WORKSPACE/android/test/java/com/dslink/emulator/PureJavaTest.java
          java -cp out:junit-4.13.2.jar:hamcrest-core-1.3.jar org.junit.runner.JUnitCore com.dslink.emulator.PureJavaTest
      - name: Build APKs (core + RetroArch + DSLink)
        env:
          # The NDK that ships with the runner image builds the core; Gradle fetches the NDK RetroArch pins itself.
          ANDROID_NDK: ${{ env.ANDROID_NDK_LATEST_HOME }}
          TASKS: "testDslinkDebugUnitTest lintDslinkDebug assembleDslinkDebug assembleDslinkRelease"
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" scripts/build_android.sh
      - name: Collect
        run: |
          mkdir -p dist
          cp upstream/retroarch/pkg/android/phoenix/build/outputs/apk/dslink/debug/*.apk dist/DSLink-debug.apk
          cp upstream/retroarch/pkg/android/phoenix/build/outputs/apk/dslink/release/*.apk dist/DSLink-release.apk || true
          cp -r upstream/retroarch/pkg/android/phoenix/build/reports dist/reports || true
          sha256sum dist/*.apk | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DSLink-android
          path: dist
