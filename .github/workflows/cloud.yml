name: cloud

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: no ROM / BIOS / firmware tracked in the repository
        run: python3 scripts/check_no_private.py
      - name: vet + build
        run: cd cloud/gateway && go vet ./... && go build ./...

  runtime-tests:
    # DSLink Runtime process-level tests (no RetroArch involved): single DS, bridge parity, two simultaneous DS instances.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 ffmpeg \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Homebrew test ROMs
        run: mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
      - name: Build dslink tools, melonDS DS core, DSLink Runtime
        run: |
          cmake -S dslink -B build/dslink -G Ninja -DCMAKE_BUILD_TYPE=Release -DDSLINK_BUILD_TESTS=OFF && cmake --build build/dslink
          . upstream/versions.env && cmake -S upstream/melonds-ds -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPENGL=OFF -DENABLE_OGLRENDERER=OFF -DMELONDS_REPOSITORY_TAG="$MELONDS_COMMIT" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build/core --parallel
          cmake -S runtime -B build/rt -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/rt
      - name: Runtime single instance (video/audio/input/touch/SRAM/MAC/no-content/stop)
        run: python3 tests/runtime/test_single.py build/rt/dslink-runtime build/core/src/libretro/melondsds_libretro.so build/rom/dslink_test_1.nds build/dslink/dslink_cfgtool
      - name: Real DS wireless frames over the Multiplayer Bridge (ARM7 Wi-Fi homebrew, no RetroArch)
        run: python3 tests/runtime/test_wifi_bridge.py build/rt/dslink-runtime build/core/src/libretro/melondsds_libretro.so build/rom/dslink_test_1.nds build/rom/dslink_test_2.nds build/dslink/dslink_cfgtool
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Gateway session provisioning contract (ticketed private content, per-slot firmware, SRAM persistence)
        run: |
          (cd cloud/gateway && go build -o ../../build/dslink-gateway .)
          DSLINK_INTERNAL_TOKEN=internal-secret DSLINK_BACKEND=runtime DSLINK_VIDEO_CODEC=vp8 DSLINK_RUNTIME=$PWD/build/rt/dslink-runtime DSLINK_CORE=$PWD/build/core/src/libretro/melondsds_libretro.so \
          DSLINK_CFGTOOL=$PWD/build/dslink/dslink_cfgtool DSLINK_ROMCHECK=$PWD/build/dslink/dslink_romcheck DSLINK_WORKDIR=/tmp/dslink-cloud DSLINK_LOOPBACK=1 \
            build/dslink-gateway -addr :8080 -web cloud/web > /tmp/gw.log 2>&1 &
          sleep 3; python3 cloud/tests/internal_session.py http://localhost:8080 build/rom/dslink_test_1.nds
      - name: Peer loss never crashes the surviving console (blocking MP reply wait + SIGKILLed peer)
        run: python3 tests/runtime/test_peer_loss.py build/rt/dslink-runtime build/rt/dslink_npt_libretro.so 8
      - name: Download Play diagnostics state machine (synthetic frames)
        run: build/rt/dlplay_test
      - name: "Multiplayer gateway (Go): session state machine, lobby, QR payload, discovery, network pre-check, join auth/lockout/expiry"
        run: cd cloud/gateway && go vet ./... && go test ./...
      - name: LAN RadioTransport unit tests (discovery, authenticated join, resequencer, loss/jitter, lockout)
        run: build/rt/lan_test
      - name: Distributed Mode - real DS wireless frames ONLY over the LAN transport (two Runtime processes, discovery, reconnect, crash)
        run: python3 tests/runtime/test_lan_bridge.py build/rt/dslink-runtime build/core/src/libretro/melondsds_libretro.so build/rom/dslink_test_1.nds build/rom/dslink_test_2.nds build/dslink/dslink_cfgtool
      - name: Two simultaneous DS instances
        run: python3 tests/runtime/test_two_ds.py build/rt/dslink-runtime build/core/src/libretro/melondsds_libretro.so build/rom/dslink_test_1.nds build/rom/dslink_test_2.nds build/dslink/dslink_cfgtool
      - name: Android data path on the desktop (shared-memory front end - raw frames, audio ring, buttons, touch, pause, quit - no encoder, no control link)
        run: python3 tests/runtime/test_shm_frontend.py build/rt/dslink-runtime build/core/src/libretro/melondsds_libretro.so build/rt/shm_probe build/rom/dslink_test_1.nds

  worker:
    # Accounts, passkeys, friends, presence, private library, invites, sessions: Workers runtime (workerd) with real D1 / R2 / Durable Objects, locally.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd cloud/worker && npm ci --legacy-peer-deps && npx tsc --noEmit && npx vitest run
      - name: Touch controls layout engine (4 layouts, geometry/hit areas)
        run: cd cloud/worker && node --test test/controls_layout.test.mjs

  pwa-e2e:
    # PWA in real Chrome (mobile emulation, virtual passkey authenticator): Worker (wrangler dev) -> gateway -> DSLink Runtime -> melonDS -> WebRTC H.264.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 libavcodec-dev libavutil-dev libswscale-dev libswresample-dev gcc-arm-none-eabi binutils-arm-none-eabi
          cd cloud/worker && npm ci --legacy-peer-deps
          cd ../tests && npm install && npx playwright install --with-deps chrome
      - name: Build everything
        run: |
          mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
          cmake -S dslink -B build/dslink -G Ninja -DCMAKE_BUILD_TYPE=Release -DDSLINK_BUILD_TESTS=OFF && cmake --build build/dslink
          . upstream/versions.env && cmake -S upstream/melonds-ds -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPENGL=OFF -DENABLE_OGLRENDERER=OFF -DMELONDS_REPOSITORY_TAG="$MELONDS_COMMIT" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build/core --parallel
          cmake -S runtime -B build/rt -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/rt
          (cd cloud/gateway && go build -o ../../build/dslink-gateway .)
      - name: Start gateway (stands in for the Container) and Worker
        run: |
          DSLINK_INTERNAL_TOKEN=internal-secret DSLINK_BACKEND=runtime DSLINK_RUNTIME=$PWD/build/rt/dslink-runtime DSLINK_CORE=$PWD/build/core/src/libretro/melondsds_libretro.so \
          DSLINK_CFGTOOL=$PWD/build/dslink/dslink_cfgtool DSLINK_ROMCHECK=$PWD/build/dslink/dslink_romcheck DSLINK_WORKDIR=/tmp/dslink-cloud DSLINK_LOOPBACK=1 \
            build/dslink-gateway -addr :8080 -web cloud/web > /tmp/gw.log 2>&1 &
          cd cloud/worker && npx wrangler d1 migrations apply dslink --local -c wrangler.dev.jsonc && (npx wrangler dev -c wrangler.dev.jsonc --port 8787 --local > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf localhost:8787/api/health && break; sleep 1; done
      - name: PWA signaling contract on the real Worker (Durable Object rooms - code, tokens, whitelisted messages, cleanup, no payload)
        run: cd cloud/tests && node signal_contract.mjs http://localhost:8787
      - name: PWA end-to-end
        env: { CHROME: /opt/google/chrome/chrome }
        run: cd cloud/tests && node pwa_e2e.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds"
      - name: Touch controls in real Chrome (4 layouts, multitouch, stylus, FOCUS)
        env: { CHROME: /opt/google/chrome/chrome }
        run: cd cloud/tests && node controls_e2e.mjs http://localhost:8787
      - name: Multiplayer UX end to end (two devices = two gateways, two browsers, only through the UI; LAN only, no cloud)
        env:
          CHROME: /opt/google/chrome/chrome
          DSLINK_GATEWAY: ${{ github.workspace }}/build/dslink-gateway
          DSLINK_RUNTIME: ${{ github.workspace }}/build/rt/dslink-runtime
          DSLINK_CORE: ${{ github.workspace }}/build/core/src/libretro/melondsds_libretro.so
          DSLINK_CFGTOOL: ${{ github.workspace }}/build/dslink/dslink_cfgtool
          DSLINK_ROMCHECK: ${{ github.workspace }}/build/dslink/dslink_romcheck
        run: cd cloud/tests && node mp_ux_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/mpshots
      - name: Android native display mode end to end (real UI, fake app bridge writing shared memory, gateway as the app starts it; homebrew only)
        env:
          CHROME: /opt/google/chrome/chrome
          DSLINK_GATEWAY: ${{ github.workspace }}/build/dslink-gateway
          DSLINK_RUNTIME: ${{ github.workspace }}/build/rt/dslink-runtime
          DSLINK_CORE: ${{ github.workspace }}/build/core/src/libretro/melondsds_libretro.so
          DSLINK_CFGTOOL: ${{ github.workspace }}/build/dslink/dslink_cfgtool
          DSLINK_ROMCHECK: ${{ github.workspace }}/build/dslink/dslink_romcheck
        run: cd cloud/tests && node mp_native_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" "$PWD/../../build/rt/shm_probe" /tmp/mpnative
      - name: single player e2e (GIOCA - one Runtime, no room/WebRTC/encoder, per-game save)
        env:
          CHROME: /opt/google/chrome/chrome
          DSLINK_GATEWAY: ${{ github.workspace }}/build/dslink-gateway
          DSLINK_RUNTIME: ${{ github.workspace }}/build/rt/dslink-runtime
          DSLINK_CORE: ${{ github.workspace }}/build/core/src/libretro/melondsds_libretro.so
          DSLINK_CFGTOOL: ${{ github.workspace }}/build/dslink/dslink_cfgtool
          DSLINK_ROMCHECK: ${{ github.workspace }}/build/dslink/dslink_romcheck
        run: cd cloud/tests && node mp_single_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" "$PWD/../../build/rt/shm_probe" /tmp/mpsingle
      - name: Hosted V0 end to end - phone host + iPhone-like browser guest (gateway started as the Android app starts it, guest page on the LAN address, WebRTC video/audio/input; homebrew only)
        env:
          CHROME: /opt/google/chrome/chrome
          DSLINK_GATEWAY: ${{ github.workspace }}/build/dslink-gateway
          DSLINK_RUNTIME: ${{ github.workspace }}/build/rt/dslink-runtime
          DSLINK_CORE: ${{ github.workspace }}/build/core/src/libretro/melondsds_libretro.so
          DSLINK_CFGTOOL: ${{ github.workspace }}/build/dslink/dslink_cfgtool
          DSLINK_ROMCHECK: ${{ github.workspace }}/build/dslink/dslink_romcheck
        run: cd cloud/tests && node mp_hosted_phone_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" "$PWD/../../build/rt/shm_probe" "$(hostname -I | awk '{print $1}')" /tmp/mphosted
      - name: Hosted V0 with TWO iPhone-like browser guests (PLAYER 2 + PLAYER 3, three consoles on the host, one drops) (gateway started as the Android app starts it, guest page on the LAN address, WebRTC video/audio/input; homebrew only)
        env:
          CHROME: /opt/google/chrome/chrome
          DSLINK_GATEWAY: ${{ github.workspace }}/build/dslink-gateway
          DSLINK_RUNTIME: ${{ github.workspace }}/build/rt/dslink-runtime
          DSLINK_CORE: ${{ github.workspace }}/build/core/src/libretro/melondsds_libretro.so
          DSLINK_CFGTOOL: ${{ github.workspace }}/build/dslink/dslink_cfgtool
          DSLINK_ROMCHECK: ${{ github.workspace }}/build/dslink/dslink_romcheck
        run: cd cloud/tests && node mp_hosted_two_phones_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" "$PWD/../../build/rt/shm_probe" "$(hostname -I | awk '{print $1}')" /tmp/mphosted2
      - name: "Cloudflare Containers media path (no inbound UDP): browsers <-> TURN relay <-> gateway, relay-only"
        env: { CHROME: /opt/google/chrome/chrome, DSLINK_VIDEO_CODEC: h264 }
        run: |
          pkill -x dslink-gateway || true; sleep 1
          cloud/tests/turn_relay.sh "$PWD/build/rt/dslink-runtime" "$PWD/build/core/src/libretro/melondsds_libretro.so" "$PWD/build/dslink/dslink_cfgtool" "$PWD/build/dslink/dslink_romcheck" "$PWD/build/rom/dslink_test_1.nds" "$PWD/build/rom/dslink_test_2.nds"
      - if: always()
        run: tail -60 /tmp/gw.log /tmp/wrangler.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pwa-e2e-screenshots, path: "/tmp/pwa_*_game.png\n/tmp/mpshots/*.png" }

  retroarch-parity:
    # RetroArch is REFERENCE ONLY: built here solely to compare behaviour (bridge routing, A/B frontend parity).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 ffmpeg xvfb xdotool pulseaudio \
            build-essential libavcodec-dev libavutil-dev libswscale-dev libswresample-dev gcc-arm-none-eabi binutils-arm-none-eabi \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libxkbcommon-x11-dev libpulse-dev libgl1-mesa-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxi-dev zlib1g-dev
      - name: Homebrew test ROMs
        run: mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
      - name: Build tools, core, runtime
        run: |
          cmake -S dslink -B build/dslink -G Ninja -DCMAKE_BUILD_TYPE=Release -DDSLINK_BUILD_TESTS=OFF && cmake --build build/dslink
          . upstream/versions.env && cmake -S upstream/melonds-ds -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPENGL=OFF -DENABLE_OGLRENDERER=OFF -DMELONDS_REPOSITORY_TAG="$MELONDS_COMMIT" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build/core --parallel
          cmake -S runtime -B build/rt -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build/rt
      - name: Build RetroArch (reference, patched as in the baseline)
        run: |
          mkdir -p build/ra && cp -r upstream/retroarch/. build/ra/ && rm -rf build/ra/.git
          for p in patches/retroarch/*.patch; do patch -p1 -d build/ra < "$p"; done
          cd build/ra && ./configure --enable-x11 --enable-opengl --disable-opengl_core --disable-opengl1 --disable-xvideo --enable-pulse \
            --disable-wayland --disable-egl --disable-alsa --disable-oss --disable-qt --disable-sdl2 --disable-udev --disable-vulkan \
            --disable-vulkan_display --disable-ffmpeg --disable-cg --enable-glsl --disable-glslang --disable-jack --disable-kms \
            --disable-materialui --disable-xmb --disable-ozone --enable-networking --disable-cheevos --disable-discord --disable-v4l2 --disable-libusb
          make -j"$(nproc)"
      - name: Bridge parity (same core under RetroArch Netplay vs Runtime bridge)
        run: python3 tests/runtime/test_bridge_parity.py $PWD/build/rt/dslink-runtime $PWD/build/rt/dslink_npt_libretro.so $PWD/build/ra/retroarch
      - name: A/B frontend parity (RetroArch vs Runtime, same core/ROM)
        run: |
          (Xvfb :151 -screen 0 512x768x24 >/dev/null 2>&1 &)
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=parity_ra || true
          python3 tests/parity/ab_parity.py $PWD/build/rt/dslink-runtime $PWD/build/core/src/libretro/melondsds_libretro.so $PWD/build/ra/retroarch $PWD/build/rom/dslink_test_1.nds $PWD/build/dslink/dslink_cfgtool

  container-e2e:
    # Builds the PRODUCTION image (DSLink Runtime, no RetroArch) and drives it with two real Chrome browsers (WebRTC, H.264).
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Homebrew test ROMs (own code, built with arm-none-eabi-gcc)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
          mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
      - name: Build the container
        run: docker build -f cloud/Dockerfile.runtime -t dslink-cloud .
      - name: Start the container
        run: |
          docker run -d --name dslink -p 8080:8080 -e DSLINK_DEBUG=1 dslink-cloud
          for i in $(seq 1 30); do curl -sf localhost:8080/api/status && break; sleep 1; done
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Playwright + Chromium
        run: cd cloud/tests && npm install && npx playwright install --with-deps chrome
      - name: Product flow through the UI (emulator 2 has no cartridge)
        env: { CHROME: /opt/google/chrome/chrome }
        run: cd cloud/tests && node browser_ui_nocart.mjs http://localhost:8080 "$PWD/../../build/rom/dslink_test_1.nds"
      - name: Independent audio/video/input/touch (compatibility mode, both emulators have a test ROM)
        env: { CHROME: /opt/google/chrome/chrome }
        run: cd cloud/tests && node browser_e2e.mjs http://localhost:8080 "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds"
      - name: Container logs
        if: always()
        run: docker logs dslink | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-e2e-screenshots
          path: |
            /tmp/ui_A.png
            /tmp/ui_B.png
            /tmp/e2e_A.png
            /tmp/e2e_B.png
