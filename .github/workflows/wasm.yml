name: wasm

# DSLink PWA + WebAssembly (Foundation 1): the melonDS DS core and the DSLink libretro host compiled with Emscripten, the player page, and an end-to-end browser test
# (real Chrome, homebrew test ROMs only). Produces the static PWA as an artifact.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Private file guard (no ROM / BIOS / firmware / refs in the repository)
        run: python3 scripts/check_no_private.py
      - name: Pinned upstream (melonDS DS submodule only)
        run: git submodule update --init upstream/melonds-ds && cat upstream/versions.env | grep -E "^(MELONDS|EMSCRIPTEN|EMSDK)"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 gcc-arm-none-eabi binutils-arm-none-eabi clang lld llvm mame-tools
          cd cloud/tests && npm install && npx playwright install --with-deps chrome
      - name: Homebrew test ROMs (own code)
        run: mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
      - name: Emscripten SDK (pinned)
        uses: actions/cache@v4
        with:
          path: build/emsdk
          key: emsdk-${{ hashFiles('upstream/versions.env') }}
      - name: WASM BUILD (melonDS DS core + DSLink Runtime for WebAssembly)
        run: scripts/build_wasm.sh
      - name: PLAYSPHERE PS1 core build (PCSX-ReARMed pinned in upstream/versions.env -> WebAssembly; no BIOS, no disc in the repository)
        run: scripts/build_ps1_wasm.sh
      - name: PLAYSPHERE PS1 + multi-core end to end in Chrome (redistributable test discs built from tools/ps1; boot, video NTSC/PAL, audio, digital + analog input, gamepad, memory card + reload, bin/cue, chd, multi-disc, disc swap, save states, DS -> PS1 -> DS switch without leaks)
        env:
          CHROME: /opt/google/chrome/chrome
        run: |
          cd cloud/tests
          node play_ps1_e2e.mjs
          node play_multicore_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds"
      - name: AUDIO RING unit test (adaptive buffer, drift controller, underrun events, overrun guard)
        run: node cloud/tests/audio_ring_unit.mjs
      - name: PWA end to end in Chrome (load, core init, homebrew boot, video, audio pipeline, input, touch, save, save reload, OPFS + IndexedDB, offline, no network emulation)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_wasm_e2e.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/playwasm
      - name: PWA mobile hardening (audio underruns, render pacing, main-thread stalls, throttled CPU, background/interruption/bfcache, rotation, OffscreenCanvas render worker, SharedArrayBuffer audio path)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_wasm_hardening.mjs "$PWD/../../build/rom/dslink_test_1.nds" /tmp/playhard
      - name: Distributed signaling contract (Node room server, same room module as the Worker)
        run: node cloud/tests/signal_contract.mjs
      - name: DISTRIBUTED PWA <-> PWA in Chrome (two browsers, two melonDS WASM, one WebRTC DataChannel with only DS radio frames; lobby, quality gate, A->B, B->A, no media stream, disconnect, reconnect, cleanup)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_wasm_distributed.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/playdist
      - name: Download Play assistant unit test (average-hash identical to the native driver, refs.json validation, milestones)
        run: node cloud/tests/dlassist_unit.mjs
      - name: High-performance multiplayer mode (isolation by the service worker on a static host; room intent and QR join survive the reload)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_wasm_qr_isolation.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/playqr
      - name: DISTRIBUTED network fault matrix (0/5/8/10 ms, jitter, 1% and 3% loss, ordered comparison)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_wasm_distributed_matrix.mjs "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/playdist
      - name: Package the static PWA
        run: scripts/package_pwa.sh
      - name: CLOUD BASE worker (types, D1 migrations, auth, social, presence, invites, signaling Durable Objects)
        run: cd cloud/worker && npm ci --legacy-peer-deps && npx tsc --noEmit && npx vitest run
      - name: CLOUD BASE real Worker end to end (D1 migrations local, PWA served by the Worker, accounts, friends, presence, invite to room, create room, code and QR join, WebRTC)
        env:
          CHROME: /opt/google/chrome/chrome
        run: |
          sudo apt-get install -y --no-install-recommends coturn >/dev/null; sudo systemctl stop coturn 2>/dev/null || true
          cloud/tests/turn_local.sh start
          cd cloud/worker
          npx wrangler d1 migrations apply dslink --local -c wrangler.cloud.dev.jsonc
          (npx wrangler dev -c wrangler.cloud.dev.jsonc --port 8787 --local --var "DSLINK_TURN_URLS:turn:127.0.0.1:3478?transport=udp" --var "DSLINK_TURN_SECRET:dslink-local-turn-test-secret" > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:8787/api/health && break; sleep 2; done
          cd ../tests
          node signal_contract.mjs http://localhost:8787
          node play_cloud_e2e.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/playcloud
          node play_ps1_cloud_e2e.mjs http://localhost:8787
          node play_cloud_static.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds"
          python3 - <<'PY'
          import struct
          b = bytearray(open("../../build/rom/dslink_test_1.nds", "rb").read()); b[12:16] = b"BIGG"
          def crc16(d):
              c = 0xffff
              for x in d:
                  c ^= x
                  for _ in range(8): c = (c >> 1) ^ 0xa001 if c & 1 else c >> 1
              return c
          struct.pack_into("<H", b, 0x15e, crc16(bytes(b[:0x15e])))
          pad = bytearray(17 * 1024 * 1024 - len(b))
          for i in range(0, len(pad), 4093): pad[i] = (i // 4093) & 255
          open("../../build/rom/dslink_big.nds", "wb").write(bytes(b) + bytes(pad))
          PY
          node play_cloud_files_e2e.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_big.nds" /tmp/playcloudfiles
          # FASE 7: Internet multiplayer (ICE/STUN/TURN on a local coturn, preflight and quality gate, ICE restart, network change, matrix) and Party Voice (2/3/4 peers, relay)
          node netquality_unit.mjs
          node play_internet_e2e.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds"
          node play_party_e2e.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds"
          node play_party_e2e.mjs http://localhost:8787 "$PWD/../../build/rom/dslink_test_1.nds" --relay
      - name: PWA UPDATE safety (service worker versions JS + WASM together, incomplete update refused, running game never swapped, AGGIORNA from the menu, offline start)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_sw_update.mjs ../../build/pwa "$PWD/../../build/rom/dslink_test_1.nds"
      - name: PLAYSPHERE PS1 offline (lazy core cached atomically by the service worker, game starts without network)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_ps1_offline.mjs ../../build/pwa
      - name: The PWA package carries the code and no private content
        run: |
          python3 - <<'PY'
          import os, sys
          bad = []
          for d, _, fs in os.walk("build/pwa"):
              for f in fs:
                  low = f.lower()
                  if low.endswith((".nds", ".srl", ".srm", ".sav", ".chd", ".cue", ".mcr", ".pbp")) or low.startswith(("bios", "firmware", "refs", "scph", "psxonpsp")):
                      bad.append(os.path.join(d, f))
          print("PWA package guard:", "clean" if not bad else bad)
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DSLink-PWA-WASM
          path: |
            build/pwa
            build/wasm/BUILDINFO.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-e2e-screenshots
          path: |
            /tmp/playwasm/*.png
            /tmp/playhard/*.png
            /tmp/playdist/*.png
            /tmp/playdist/matrix.json
          if-no-files-found: ignore
