name: deploy-cloudflare

# Bridge workflow: runs the PlaySphere branch. R2 is OPTIONAL: if it is not enabled on the Cloudflare account (error 10042) the deployment continues
# without it ("R2 disabled - local storage mode"); the R2 smoke test and play_cloud_files_e2e run only when R2_ENABLED=true.

on:
  workflow_dispatch:
    inputs:
      run_public_e2e:
        description: Run the public browser test after deploying
        type: boolean
        default: true

concurrency: deploy-cloudflare

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      DSLINK_EXTRA_ORIGINS: ${{ vars.DSLINK_EXTRA_ORIGINS }}

      # R2 opzionale: "off" = non usare mai R2 (local storage mode).
      DSLINK_R2: ${{ vars.DSLINK_R2 }}

      # TURN opzionale.
      # Se queste variabili restano vuote, PlaySphere usa solo STUN/direct P2P.
      TURN_PROVIDER: ${{ vars.TURN_PROVIDER }}
      TURN_URL: ${{ vars.TURN_URL }}
      TURN_SECRET: ${{ secrets.TURN_SECRET }}

      # STUN custom opzionale.
      # Se vuoto, il progetto usa il default già previsto.
      DSLINK_STUN_URLS: ${{ vars.DSLINK_STUN_URLS }}

    outputs:
      url: ${{ steps.prep.outputs.URL }}
      r2: ${{ steps.prep.outputs.R2_ENABLED }}

    steps:
      - name: Credentials present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

      - name: Checkout PlaySphere branch
        uses: actions/checkout@v4
        with:
          ref: ccr-e6bc84be-j939ke

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Private file guard
        run: python3 scripts/check_no_private.py

      - name: Worker checks before touching production
        run: |
          cd cloud/worker
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          npx vitest run

      - name: Provisioning script tests (mock Cloudflare API, R2 enabled and R2 not enabled)
        run: python3 scripts/test_cf_prepare.py

      - name: Pinned upstream
        run: git submodule update --init upstream/melonds-ds

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: build/emsdk
          key: emsdk-${{ hashFiles('upstream/versions.env') }}

      - name: Build WASM and package PWA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            python3

          scripts/build_wasm.sh
          scripts/package_pwa.sh

      - name: Provision D1, private R2 (only if the account has it) and production Wrangler config
        id: prep
        run: |
          python3 scripts/cf_prepare.py | tee -a "$GITHUB_OUTPUT"
          if grep -q '^R2_ENABLED=true' "$GITHUB_OUTPUT"; then
            echo "R2 enabled - private Cloud storage on"
          else
            echo "R2 disabled — local storage mode"
            echo "R2 disabled — local storage mode" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply D1 migrations
        run: |
          cd cloud/worker
          npx wrangler d1 migrations apply dslink \
            --remote \
            -c wrangler.prod.jsonc

      - name: Deploy Worker, PWA assets and Durable Objects
        run: |
          cd cloud/worker

          vars=()

          [ -n "$TURN_URL" ] && \
            vars+=(--var "DSLINK_TURN_URLS:$TURN_URL")

          [ -n "$TURN_PROVIDER" ] && \
            vars+=(--var "DSLINK_TURN_PROVIDER:$TURN_PROVIDER")

          [ -n "$DSLINK_STUN_URLS" ] && \
            vars+=(--var "DSLINK_STUN_URLS:$DSLINK_STUN_URLS")

          npx wrangler deploy \
            -c wrangler.prod.jsonc \
            "${vars[@]}"

      - name: Set TURN secret only when TURN is configured
        if: env.TURN_SECRET != '' && env.TURN_URL != ''
        working-directory: cloud/worker
        run: |
          printf '%s' "$TURN_SECRET" | \
            npx wrangler secret put \
            DSLINK_TURN_SECRET \
            -c wrangler.prod.jsonc >/dev/null

          echo "set DSLINK_TURN_SECRET"

      - name: Ensure INTERNAL_TOKEN exists
        working-directory: cloud/worker
        run: |
          have=$(
            npx wrangler secret list \
              -c wrangler.prod.jsonc \
              --format json |
            python3 -c '
          import sys,json
          print(" ".join(s["name"] for s in json.load(sys.stdin)))
          '
          )

          case " $have " in
            *" INTERNAL_TOKEN "*)
              ;;
            *)
              openssl rand -hex 32 | \
                npx wrangler secret put \
                INTERNAL_TOKEN \
                -c wrangler.prod.jsonc >/dev/null

              echo "set INTERNAL_TOKEN"
              ;;
          esac

      - name: Smoke test public deployment (every request reports method, path and HTTP status; R2 round trip only when R2_ENABLED=true)
        run: bash scripts/cf_smoke.sh "${{ steps.prep.outputs.URL }}" "${{ steps.prep.outputs.R2_ENABLED }}"

  public-e2e:
    needs: deploy
    if: ${{ inputs.run_public_e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout PlaySphere branch
        uses: actions/checkout@v4
        with:
          ref: ccr-e6bc84be-j939ke

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies and homebrew test ROMs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3

          mkdir -p build/rom
          tests/rom/build.sh "$PWD/build/rom"

          cd cloud/tests
          npm install
          npx playwright install --with-deps chrome

      - name: Build large legal homebrew ROM for multipart upload test
        run: |
          python3 - <<'PY'
          import struct

          b = bytearray(
              open("build/rom/dslink_test_1.nds", "rb").read()
          )

          b[12:16] = b"BIGG"

          def crc16(d):
              c = 0xffff
              for x in d:
                  c ^= x
                  for _ in range(8):
                      c = (c >> 1) ^ 0xa001 if c & 1 else c >> 1
              return c

          struct.pack_into(
              "<H",
              b,
              0x15e,
              crc16(bytes(b[:0x15e]))
          )

          pad = bytearray(
              17 * 1024 * 1024 - len(b)
          )

          for i in range(0, len(pad), 4093):
              pad[i] = (i // 4093) & 255

          open(
              "build/rom/dslink_big.nds",
              "wb"
          ).write(bytes(b) + bytes(pad))
          PY

      - name: R2 disabled - local storage mode (the private-library test is skipped)
        if: ${{ needs.deploy.outputs.r2 != 'true' }}
        run: echo "R2 disabled — local storage mode; play_cloud_files_e2e skipped" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PUBLIC private-library end to end (only when R2 is enabled)
        if: ${{ needs.deploy.outputs.r2 == 'true' }}
        env:
          CHROME: /opt/google/chrome/chrome
        run: |
          cd cloud/tests

          node play_cloud_files_e2e.mjs \
            "${{ needs.deploy.outputs.url }}" \
            "$PWD/../../build/rom/dslink_test_1.nds" \
            "$PWD/../../build/rom/dslink_big.nds" \
            /tmp/playcloudfiles

      - name: PUBLIC storage mode (what the user sees with and without private Cloud storage)
        env:
          CHROME: /opt/google/chrome/chrome
        run: |
          cd cloud/tests

          node play_storage_modes_e2e.mjs \
            "${{ needs.deploy.outputs.url }}" \
            "$PWD/../../build/rom/dslink_test_1.nds"

      - name: PUBLIC account/social/WebRTC end to end
        env:
          CHROME: /opt/google/chrome/chrome
        run: |
          cd cloud/tests

          node play_cloud_e2e.mjs \
            "${{ needs.deploy.outputs.url }}" \
            "$PWD/../../build/rom/dslink_test_1.nds" \
            "$PWD/../../build/rom/dslink_test_2.nds" \
            /tmp/playcloud
