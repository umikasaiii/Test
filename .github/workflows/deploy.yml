name: deploy-cloudflare

# DSLink Cloud: Worker (API + signaling) + Durable Objects + D1 + (optionally) a PRIVATE R2 bucket + the PWA as static assets, all on ONE origin (https://<worker>/play/). No Containers, no Netlify. TURN is optional.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (token: Workers Scripts:Edit, D1:Edit, Account Settings:Read, and Workers R2 Storage:Edit if you use R2).
# R2 is OPTIONAL: if it is not enabled on the account (Cloudflare error 10042 "Please enable R2", which needs a payment method) the deployment carries on WITHOUT it ("R2 disabled - local storage mode"):
# games, BIOS and saves stay on the devices, the file routes answer 503 STORAGE_NOT_CONFIGURED, and accounts, friends, rooms, signaling, Internet multiplayer and Party Voice work as usual. Set the variable DSLINK_R2=off to skip R2 on purpose.
# Every run replaces the PWA and the Worker at the SAME URL; D1, R2 and Durable Object data are never deleted. See docs/CLOUD_STORAGE.md.
# Optional repository variable DSLINK_EXTRA_ORIGINS: comma separated exact origins of a static host (e.g. a Netlify test site) allowed to call the API.
on:
  workflow_dispatch:
    inputs:
      run_public_e2e:
        description: Run the public browser test after deploying
        type: boolean
        default: true
concurrency: deploy-cloudflare
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DSLINK_EXTRA_ORIGINS: ${{ vars.DSLINK_EXTRA_ORIGINS }}
      DSLINK_R2: ${{ vars.DSLINK_R2 }}                  # optional: "off" = never use R2 (local storage mode)
      # Internet multiplayer (optional): without them the Worker hands out public STUN only and the app says that a relay is unavailable
      TURN_PROVIDER: ${{ vars.TURN_PROVIDER }}          # label only (e.g. coturn, cloudflare, twilio-nts)
      TURN_URL: ${{ vars.TURN_URL }}                    # comma separated turn:/turns: URLs of your TURN server, e.g. turn:turn.example.com:3478?transport=udp,turns:turn.example.com:5349?transport=tcp
      TURN_SECRET: ${{ secrets.TURN_SECRET }}           # the coturn static-auth-secret (use-auth-secret): the Worker derives short-lived credentials from it, it never reaches the app
      DSLINK_STUN_URLS: ${{ vars.DSLINK_STUN_URLS }}    # optional: your own STUN servers (default: public Google STUN)
    outputs:
      url: ${{ steps.prep.outputs.URL }}
      r2: ${{ steps.prep.outputs.R2_ENABLED }}
    steps:
      - name: Credentials present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Private file guard
        run: python3 scripts/check_no_private.py
      - name: Worker checks (types and tests, with and without R2) before touching production
        run: cd cloud/worker && npm ci --legacy-peer-deps && npx tsc --noEmit && npx vitest run
      - name: Provisioning script tests (mock Cloudflare API, R2 enabled and R2 not enabled)
        run: python3 scripts/test_cf_prepare.py
      - name: Pinned upstream
        run: git submodule update --init upstream/melonds-ds
      - name: Emscripten SDK (pinned)
        uses: actions/cache@v4
        with:
          path: build/emsdk
          key: emsdk-${{ hashFiles('upstream/versions.env') }}
      - name: WASM build and PWA package (same-origin config, no cloud address needed)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3
          scripts/build_wasm.sh
          scripts/package_pwa.sh
      - name: Provision D1 + (when the account has R2) the private R2 bucket, and write wrangler.prod.jsonc
        id: prep
        run: |
          python3 scripts/cf_prepare.py | tee -a "$GITHUB_OUTPUT"
          if grep -q '^R2_ENABLED=true' "$GITHUB_OUTPUT"; then echo "R2 enabled - private Cloud storage on"; else echo "R2 disabled - local storage mode"; echo "R2 disabled — local storage mode" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: D1 migrations (remote)
        run: cd cloud/worker && npx wrangler d1 migrations apply dslink --remote -c wrangler.prod.jsonc
      - name: Deploy Worker, assets and Durable Objects
        run: |
          cd cloud/worker
          vars=()
          [ -n "$TURN_URL" ] && vars+=(--var "DSLINK_TURN_URLS:$TURN_URL")
          [ -n "$TURN_PROVIDER" ] && vars+=(--var "DSLINK_TURN_PROVIDER:$TURN_PROVIDER")
          [ -n "$DSLINK_STUN_URLS" ] && vars+=(--var "DSLINK_STUN_URLS:$DSLINK_STUN_URLS")
          npx wrangler deploy -c wrangler.prod.jsonc "${vars[@]}"
      - name: Secret DSLINK_TURN_SECRET (only when TURN is configured; never stored in the repository)
        if: env.TURN_SECRET != '' && env.TURN_URL != ''
        working-directory: cloud/worker
        run: printf '%s' "$TURN_SECRET" | npx wrangler secret put DSLINK_TURN_SECRET -c wrangler.prod.jsonc >/dev/null && echo "set DSLINK_TURN_SECRET"
      - name: Secret INTERNAL_TOKEN (created only if missing)
        working-directory: cloud/worker
        run: |
          have=$(npx wrangler secret list -c wrangler.prod.jsonc --format json | python3 -c 'import sys,json;print(" ".join(s["name"] for s in json.load(sys.stdin)))')
          case " $have " in *" INTERNAL_TOKEN "*) ;; *) openssl rand -hex 32 | npx wrangler secret put INTERNAL_TOKEN -c wrangler.prod.jsonc >/dev/null; echo "set INTERNAL_TOKEN";; esac
      - name: Smoke test the public URL (every request reports its method, path and HTTP status; R2 round trip only when R2_ENABLED=true)
        run: bash scripts/cf_smoke.sh "${{ steps.prep.outputs.URL }}" "${{ steps.prep.outputs.R2_ENABLED }}"

  public-e2e:
    needs: deploy
    if: ${{ inputs.run_public_e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies and homebrew test ROMs (own code)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi python3
          mkdir -p build/rom && tests/rom/build.sh "$PWD/build/rom"
          cd cloud/tests && npm install && npx playwright install --with-deps chrome
      - name: Big homebrew ROM for the multipart upload test (own code, no commercial content)
        run: |
          python3 - <<'PY'
          import struct
          b = bytearray(open("build/rom/dslink_test_1.nds", "rb").read()); b[12:16] = b"BIGG"
          def crc16(d):
              c = 0xffff
              for x in d:
                  c ^= x
                  for _ in range(8): c = (c >> 1) ^ 0xa001 if c & 1 else c >> 1
              return c
          struct.pack_into("<H", b, 0x15e, crc16(bytes(b[:0x15e])))
          pad = bytearray(17 * 1024 * 1024 - len(b))
          for i in range(0, len(pad), 4093): pad[i] = (i // 4093) & 255
          open("build/rom/dslink_big.nds", "wb").write(bytes(b) + bytes(pad))
          PY
      - name: R2 disabled - local storage mode (the private-library test is skipped)
        if: ${{ needs.deploy.outputs.r2 != 'true' }}
        run: |
          echo "R2 disabled — local storage mode: play_cloud_files_e2e skipped" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: PUBLIC private-library end to end (ROM and BIOS in R2, new device, saves, conflicts, offline, big upload, interrupted download) - only when R2 is enabled
        if: ${{ needs.deploy.outputs.r2 == 'true' }}
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_cloud_files_e2e.mjs "${{ needs.deploy.outputs.url }}" "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_big.nds" /tmp/playcloudfiles
      - name: PUBLIC storage mode (what the user sees with and without private Cloud storage; the local game plays either way)
        env:
          CHROME: /opt/google/chrome/chrome
        run: cd cloud/tests && node play_storage_modes_e2e.mjs "${{ needs.deploy.outputs.url }}" "$PWD/../../build/rom/dslink_test_1.nds"
      - name: PUBLIC end to end (accounts, friends, presence, invite, create room, code join, WebRTC)
        env:
          CHROME: /opt/google/chrome/chrome
        run: |
          cd cloud/tests
          node play_cloud_e2e.mjs "${{ needs.deploy.outputs.url }}" "$PWD/../../build/rom/dslink_test_1.nds" "$PWD/../../build/rom/dslink_test_2.nds" /tmp/playcloud
