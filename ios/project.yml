# XcodeGen spec -> DSLink.xcodeproj (generated on the Mac / CI runner: `xcodegen generate`).
name: DSLink
options:
  bundleIdPrefix: com.dslink
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is intentionally NOT configured: select your team in Xcode (Signing & Capabilities) or pass
    # DEVELOPMENT_TEAM=... on the command line. CI builds with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Automatic
targets:
  DSLink:
    type: application
    platform: iOS
    sources:
      - path: DSLink
      - path: ../dslink/src
        excludes: []
      - path: ../dslink/include
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dslink.emulator
        INFOPLIST_FILE: DSLink/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: DSLink/DSLink-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../dslink/include"
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        ENABLE_BITCODE: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    scheme:
      testTargets:
        - DSLinkTests
  DSLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSLinkTests
    dependencies:
      - target: DSLink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DSLink.app/DSLink"
        BUNDLE_LOADER: "$(TEST_HOST)"
